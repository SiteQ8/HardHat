name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck hardhat.sh
      - name: Syntax check
        run: bash -n hardhat.sh
      - name: Version check
        run: bash hardhat.sh --version
