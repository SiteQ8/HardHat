<svg width="900" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140808"/>
      <stop offset="50%" stop-color="#2a0e0e"/>
      <stop offset="100%" stop-color="#140808"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none" stroke="#301515" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect width="900" height="240" fill="url(#bg)"/>
  <rect width="900" height="240" fill="url(#grid)" opacity="0.4"/>
  <!-- Hard hat icon -->
  <circle cx="100" cy="120" r="38" fill="none" stroke="#ee0000" stroke-width="2" opacity="0.2"/>
  <text x="100" y="135" text-anchor="middle" font-size="42">🔨</text>
  <circle cx="800" cy="120" r="30" fill="none" stroke="#cc0000" stroke-width="1.5" opacity="0.15"/>
  <text x="800" y="133" text-anchor="middle" font-size="32">🛡️</text>
  <!-- Title -->
  <text x="450" y="72" text-anchor="middle" font-family="monospace" font-size="46" font-weight="700" fill="#ee0000">HardHat</text>
  <text x="450" y="102" text-anchor="middle" font-family="monospace" font-size="15" fill="#c8d6e5">Red Hat Enterprise Linux Hardening Tool</text>
  <text x="450" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7a8ea0">The only tool you need to harden your Red Hat environment</text>
  <!-- Badges row -->
  <rect x="200" y="152" width="80" height="22" rx="4" fill="#ee000020" stroke="#ee000050" stroke-width="1"/>
  <text x="240" y="167" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#ee0000">CIS Bench</text>
  <rect x="290" y="152" width="80" height="22" rx="4" fill="#dd000020" stroke="#dd000050" stroke-width="1"/>
  <text x="330" y="167" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#dd0000">NIST 800-53</text>
  <rect x="380" y="152" width="75" height="22" rx="4" fill="#cc000020" stroke="#cc000050" stroke-width="1"/>
  <text x="417" y="167" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#cc0000">DISA STIG</text>
  <rect x="465" y="152" width="65" height="22" rx="4" fill="#bb000020" stroke="#bb000050" stroke-width="1"/>
  <text x="497" y="167" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#bb0000">SELinux</text>
  <rect x="540" y="152" width="70" height="22" rx="4" fill="#dd000020" stroke="#dd000050" stroke-width="1"/>
  <text x="575" y="167" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#dd0000">11 Modules</text>
  <rect x="620" y="152" width="80" height="22" rx="4" fill="#cc000020" stroke="#cc000050" stroke-width="1"/>
  <text x="660" y="167" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#cc0000">HTML Report</text>
  <!-- Stats line -->
  <text x="450" y="205" text-anchor="middle" font-family="monospace" font-size="11" fill="#4a5d70">938 lines • 11 modules • 100+ checks • CIS Level 1 &amp; 2 • RHEL 8/9 • Auto-fix • Auto-backup • Bash</text>
  <!-- Version -->
  <rect x="405" y="215" width="90" height="18" rx="4" fill="#ee000015" stroke="#ee000030" stroke-width="1"/>
  <text x="450" y="228" text-anchor="middle" font-family="monospace" font-size="9" font-weight="600" fill="#ee0000">v2.0.0 — 2026</text>
</svg>
